# Perfil de despliegue: sin datos de demo. El esquema lo lleva Flyway, igual
# que en desarrollo (ver application.yml).
huecko:
  seed:
    enabled: false

# Cualquier cuenta registrada podía ver el detalle de salud (bases, disco).
management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.huecko.backend: INFO
