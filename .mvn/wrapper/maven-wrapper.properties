# Maven Wrapper: permite compilar y arrancar el proyecto sin tener Maven
# instalado. La primera ejecucion de ./mvnw descarga esta distribucion en
# ~/.m2/wrapper y la reutiliza a partir de entonces.
#
# distributionType=only-script evita tener que versionar un .jar en el repo.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
