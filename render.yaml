# Blueprint de Render: la API, el servicio de IA y la web, en el plan gratuito.
#
# Render > New > Blueprint > este repo. Pide en pantalla los valores marcados
# `sync: false` (bases de datos, dominio del frontend, clave de Gemini…); los
# secretos compartidos los genera él. Paso a paso en docs/DESPLIEGUE.md.
#
# Plan gratuito: cada servicio se duerme tras ~15 min sin peticiones y tarda
# alrededor de un minuto en despertar. Mientras la API duerme, las votaciones
# no se cierran; lo hacen todas juntas en cuanto alguien la despierta.

services:
  - type: web
    name: huecko-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    # Liveness y no la salud completa: si Neon o Atlas fallan un momento, la
    # API sigue viva y Render no la reinicia en bucle.
    healthCheckPath: /api/actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # 512 MB de RAM en el plan gratuito: GC simple, menos compilación JIT y
      # metaspace acotado para que quepa y arranque antes. Si se queda sin
      # memoria, sale y Render la reinicia en vez de quedarse colgada.
      # Para cambiarlo, edita este archivo y haz push: un cambio a mano en
      # Environment lo pisa el siguiente sync del Blueprint.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=55 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError
      # 200 hilos por defecto, cada uno con su pila: de sobra para una demo.
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "40"
      - key: HUECKO_JWT_SECRET
        generateValue: true
      - key: HUECKO_ZONA_HORARIA
        value: America/Lima

      # Postgres (Supabase, pooler en modo sesión: Render no tiene IPv6 y el
      # host directo de Supabase solo tiene IPv6):
      # jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      # con usuario postgres.<ref-del-proyecto>. También vale Neon.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Mongo (Atlas): mongodb+srv://<usuario>:<clave>@<cluster>/huecko?retryWrites=true&w=majority
      - key: SPRING_DATA_MONGODB_URI
        sync: false

      # Dominio exacto de la web, p. ej. https://huecko-web.onrender.com.
      # Evita comodines como https://huecko-*.onrender.com: cualquiera puede
      # crear un servicio cuyo nombre encaje con ese patrón.
      - key: HUECKO_CORS_ORIGINS
        sync: false
      # Déjalo vacío al principio: regístrate en la app con tu correo y
      # después ponlo aquí (ver docs/DESPLIEGUE.md, paso 6).
      - key: HUECKO_ADMIN_EMAILS
        sync: false

      # IA: URL pública de huecko-ia (https://huecko-ia-xxxx.onrender.com).
      - key: HUECKO_IA_URL
        sync: false
      - key: HUECKO_IA_TOKEN
        generateValue: true
      - key: HUECKO_IMPREVISTOS_EVALUADOR
        value: ia
      - key: HUECKO_IA_RECOMENDACIONES
        value: "true"
      - key: HUECKO_IA_TIEMPO_MAXIMO_MS
        value: "3000"

  - type: web
    name: huecko-ia
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/Nakusuo/huecko-ai-service
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud
    envVars:
      # El mismo secreto que generó Render para la API.
      - key: HUECKO_IA_TOKEN
        fromService:
          type: web
          name: huecko-api
          envVarKey: HUECKO_IA_TOKEN
      # Clave gratuita de https://aistudio.google.com
      - key: GEMINI_API_KEY
        sync: false
      # flash-latest devolvía 503 (saturado) en octubre de 2026; lite responde.
      - key: GEMINI_MODELO
        value: gemini-flash-lite-latest
      - key: GEMINI_TIEMPO_MAXIMO
        value: "2.5"

  # La web (huecko-frontend) como sitio estático: no se duerme. Las cabeceras
  # son las de vercel.json; si cambias la CSP allí, cámbiala también aquí.
  - type: web
    name: huecko-web
    runtime: static
    repo: https://github.com/Nakusuo/huecko-frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL pública de huecko-api con /api al final. Se lee al construir:
      # después de cambiarla, redespliega la web.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.onrender.com wss://*.onrender.com https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
